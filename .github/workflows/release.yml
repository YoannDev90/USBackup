name: Build & Release

on:
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Version tag (e.g. v0.1.0)"
                required: true

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    release:
        name: Build Linux
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false

            - name: Install Rust
              uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
              with:
                  targets: x86_64-unknown-linux-gnu

            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libudev-dev pkg-config

            - name: Build
              run: cargo build --release --target x86_64-unknown-linux-gnu

            - name: Prepare Artifact
              run: |
                  mkdir -p dist
                  cp target/x86_64-unknown-linux-gnu/release/USBackup dist/usbackup-linux-amd64

            - name: Upload artifacts
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: usbackup-linux-amd64
                  path: dist/usbackup-linux-amd64

    github-release:
        name: Create GitHub Release
        needs: release
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  path: artifacts

            - name: Create Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  TAG_NAME: ${{ github.event.inputs.tag_name }}
              run: |
                  gh release create "$TAG_NAME" \
                    artifacts/usbackup-linux-amd64/usbackup-linux-amd64 \
                    --title "Release $TAG_NAME" \
                    --latest
