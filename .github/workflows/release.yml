name: Build & Release

on:
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Version tag (e.g. v0.1.0)"
                required: true

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        name: Build (${{ matrix.arch }})
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      arch: amd64
                      target: x86_64-unknown-linux-gnu
                    - os: ubuntu-24.04-arm
                      arch: arm64
                      target: aarch64-unknown-linux-gnu
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false

            - name: Install Rust
              uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
              with:
                  targets: ${{ matrix.target }}

            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libudev-dev pkg-config

            - name: Build
              run: cargo build --release --target ${{ matrix.target }}

            - name: Prepare Artifact
              run: |
                  mkdir -p dist
                  cp target/${{ matrix.target }}/release/USBackup dist/usbackup-linux-${{ matrix.arch }}

            - name: Upload artifacts
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: usbackup-linux-${{ matrix.arch }}
                  path: dist/usbackup-linux-${{ matrix.arch }}

    github-release:
        name: Create GitHub Release
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  path: artifacts

            - name: Generate SHA256 checksums
              run: |
                  cd artifacts
                  : > SHA256SUMS
                  for dir in usbackup-linux-*/; do
                      (cd "$dir" && sha256sum "$(basename "$dir")") >> SHA256SUMS
                  done
                  cat SHA256SUMS

            - name: Create Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  TAG_NAME: ${{ github.event.inputs.tag_name }}
              run: |
                  gh release create "$TAG_NAME" \
                    artifacts/usbackup-linux-amd64/usbackup-linux-amd64 \
                    artifacts/usbackup-linux-arm64/usbackup-linux-arm64 \
                    artifacts/SHA256SUMS \
                    --title "Release $TAG_NAME" \
                    --latest
