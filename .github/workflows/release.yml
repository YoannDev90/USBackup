name: Build & Release

on:
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Version tag (e.g. v0.1.0)"
                required: true

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        name: Build (${{ matrix.asset }})
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      arch: amd64
                      target: x86_64-unknown-linux-gnu
                      binary: USBackup
                      asset: usbackup-linux-amd64
                    - os: ubuntu-24.04-arm
                      arch: arm64
                      target: aarch64-unknown-linux-gnu
                      binary: USBackup
                      asset: usbackup-linux-arm64
                    - os: windows-latest
                      arch: x64
                      target: x86_64-pc-windows-msvc
                      binary: USBackup.exe
                      asset: usbackup-windows-x64.exe
                    - os: windows-11-arm
                      arch: arm64
                      target: aarch64-pc-windows-msvc
                      binary: USBackup.exe
                      asset: usbackup-windows-arm64.exe
                    - os: macos-latest
                      arch: universal
                      target: aarch64-apple-darwin
                      binary: USBackup
                      asset: usbackup-macos-universal
                      universal: true
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false

            - name: Install Rust
              uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
              with:
                  targets: ${{ matrix.target }}

            - name: Install dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libudev-dev pkg-config

            - name: Build
              run: cargo build --release --target ${{ matrix.target }}

            # Universal binary: both Apple targets, merged with lipo
            # (plan_mac.md M6 — there is no real "universal" rustc target).
            - name: Build universal binary (macOS)
              if: matrix.universal
              shell: bash
              run: |
                  mkdir -p dist
                  rustup target add x86_64-apple-darwin
                  cargo build --release --target x86_64-apple-darwin
                  lipo -create \
                      -output dist/${{ matrix.asset }} \
                      target/aarch64-apple-darwin/release/${{ matrix.binary }} \
                      target/x86_64-apple-darwin/release/${{ matrix.binary }}
                  lipo -info dist/${{ matrix.asset }}

            - name: Prepare Artifact
              if: matrix.universal != true
              shell: bash
              run: |
                  mkdir -p dist
                  cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/${{ matrix.asset }}

            - name: Upload artifacts
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: ${{ matrix.asset }}
                  path: dist/${{ matrix.asset }}

    github-release:
        name: Create GitHub Release
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  path: artifacts

            - name: Generate SHA256 checksums
              run: |
                  cd artifacts
                  : > SHA256SUMS
                  for dir in usbackup-*/; do
                      (cd "$dir" && sha256sum "$(basename "$dir")") >> SHA256SUMS
                  done
                  cat SHA256SUMS

            - name: Create Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  TAG_NAME: ${{ github.event.inputs.tag_name }}
              run: |
                  gh release create "$TAG_NAME" \
                    artifacts/usbackup-linux-amd64/usbackup-linux-amd64 \
                    artifacts/usbackup-linux-arm64/usbackup-linux-arm64 \
                    artifacts/usbackup-macos-universal/usbackup-macos-universal \
                    artifacts/usbackup-windows-x64.exe/usbackup-windows-x64.exe \
                    artifacts/usbackup-windows-arm64.exe/usbackup-windows-arm64.exe \
                    artifacts/SHA256SUMS \
                    --title "Release $TAG_NAME" \
                    --latest

    publish-homebrew:
        name: Publish Homebrew formula
        needs: github-release
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
          - name: Checkout homebrew tap
            uses: actions/checkout@v4
            with:
              repository: YoannDev90/homebrew-tap
              token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
              path: tap

          - name: Download release checksums
            env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              mkdir -p /tmp/rel
              gh release download "${{ github.event.inputs.tag_name }}" \
                --repo "${{ github.repository }}" \
                --pattern "SHA256SUMS" --dir /tmp/rel

          - name: Generate and commit formula
            env:
              TAG_NAME: ${{ github.event.inputs.tag_name }}
            run: |
              set -euo pipefail
              cd tap
              mkdir -p Formula
              VERSION="${TAG_NAME#v}"
              AMD_SHA=$(awk '/usbackup-linux-amd64$/ {print $1}' /tmp/rel/SHA256SUMS)
              ARM_SHA=$(awk '/usbackup-linux-arm64$/ {print $1}' /tmp/rel/SHA256SUMS)
              MAC_SHA=$(awk '/usbackup-macos-universal$/ {print $1}' /tmp/rel/SHA256SUMS)

              cat > Formula/usbackup.rb <<EOF
              class Usbackup < Formula
                desc "Automated USB backup agent"
                homepage "https://github.com/YoannDev90/USBackup"
                version "${VERSION}"
                if OS.mac?
                  url "https://github.com/YoannDev90/USBackup/releases/download/${TAG_NAME}/usbackup-macos-universal"
                  sha256 "${MAC_SHA}"
                end
                if OS.linux?
                  if Hardware::CPU.arm?
                    url "https://github.com/YoannDev90/USBackup/releases/download/${TAG_NAME}/usbackup-linux-arm64"
                    sha256 "${ARM_SHA}"
                  else
                    url "https://github.com/YoannDev90/USBackup/releases/download/${TAG_NAME}/usbackup-linux-amd64"
                    sha256 "${AMD_SHA}"
                  end
                end
                license "MIT"

                def install
                  if OS.mac?
                    bin.install "usbackup-macos-universal" => "usbackup"
                  elsif Hardware::CPU.arm?
                    bin.install "usbackup-linux-arm64" => "usbackup"
                  else
                    bin.install "usbackup-linux-amd64" => "usbackup"
                  end
                end
              end
              EOF

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add Formula/usbackup.rb
              git commit -m "usbackup ${VERSION}" || echo "nothing to commit"
              git push
