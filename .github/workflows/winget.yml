name: Publish winget

on:
  workflow_run:
    workflows: ["Build & Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  winget:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: YoannDev90.USBackup
          installers-regex: '^usbackup-windows-(x64|arm64)\.exe$'
          release-tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.workflow_run.head_branch }}
          token: ${{ secrets.WINGET_TOKEN }}
