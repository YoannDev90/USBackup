[package]
name = "USBackup"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Automated USB backup agent: detects USB keys and runs signed rsync backups"
license = "MIT"
readme = "README.md"

[dependencies]
nusb = "0.2.3"
futures-lite = "2.6.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
notify-rust = "4.11"
sysinfo = "0.38.4"
env_logger = "0.11.10"
log = "0.4.29"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "sync"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
ureq = "3"
indicatif = "0.18.4"
toml = "1.1.2"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
rand = "0.10.1"
directories = "6.0.0"
walkdir = "2"
thiserror = "2"
ignore = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
lz4_flex = "0.11"
rayon = "1"

[target.'cfg(target_os = "linux")'.dependencies]
udev = "0.9.3"

[target.'cfg(target_os = "windows")'.dependencies]
filetime = "0.2"
wmi = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[features]
default = []
# Use the pure-Rust sync engine instead of the external `rsync` binary.
# Off by default: the engine stays opt-in until it is validated end-to-end on
# Linux, macOS and Windows (rsync remains the shipped fallback).
sync-engine = []

[dev-dependencies]
tempfile = "3"
criterion = "0.5"

[[bench]]
name = "sync_engine"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
