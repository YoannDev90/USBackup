[package]
name = "USBackup"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Automated USB backup agent: detects USB keys and runs signed rsync backups"
license = "MIT"
readme = "README.md"

[dependencies]
nusb = "0.2.3"
futures-lite = "2.6.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
notify-rust = "4.11"
sysinfo = "0.38.4"
udev = "0.9.3"
env_logger = "0.11.10"
log = "0.4.29"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "sync"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
ureq = "3"
indicatif = "0.18.4"
toml = "1.1.2"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
rand = "0.10.1"
directories = "6.0.0"
walkdir = "2"
thiserror = "2"
ignore = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
lz4_flex = "0.11"
rayon = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
